name: Build iOS (TrollStore)

on:
  workflow_dispatch:      # 手动点按钮触发（推荐先用这个测试）
  push:
    branches: [ main ]
    paths:
      - "Assets/**"
      - "ProjectSettings/**"
      - "Packages/**"
      - ".github/workflows/**"

jobs:
  # ============ 阶段 1：Linux 生成 Xcode 工程（免费额度）============
  generate-xcode:
    name: 1. Generate Xcode project (Linux, free)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-LieXi-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-LieXi-iOS-

      # GameCI 是 Docker 容器，只能在 Linux 上跑 —— 所以这一步必须在 ubuntu
      - name: Activate Unity License
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      # 生成 iOS Xcode 工程（iOS 是 Mono 后端，Linux 可生成工程）
      # ⚠️ 项目是中国版 2022.3.62f3c1，GameCI 官方镜像只有国际版，
      #    这里用国际版 2022.3.62f1 镜像去打开（小版本一致，一般兼容）
      - name: Build iOS (generate Xcode project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: iOS
          buildMethod: BuildScript.PerformBuild
          allowDirtyBuild: true
          # 统一容器内构建路径，避免移交 Mac 后路径错乱（官方提到的坑）
          dockerWorkspacePath: /github/workspace

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 1
          if-no-files-found: error

      - name: Return Unity License
        if: always()
        uses: game-ci/unity-return-license@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  # ============ 阶段 2：Mac 编译出未签名 .app → ldid → 巨魔 ipa ============
  build-ipa:
    name: 2. Compile & package TrollStore IPA (macOS)
    runs-on: macos-latest
    needs: generate-xcode     # 必须等阶段 1 出了工程才跑

    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: build/iOS

      - name: Locate Xcode project
        id: locate
        run: |
          set -e
          XCODEPROJ=$(find build/iOS -name "*.xcodeproj" -maxdepth 3 | head -1)
          echo "找到工程: $XCODEPROJ"
          echo "XCODEPROJ=$XCODEPROJ" >> $GITHUB_ENV

      - name: xcodebuild (unsigned .app)
        run: |
          set -e
          echo "=== 列出 scheme ==="
          xcodebuild -list -project "$XCODEPROJ"
          echo "=== 编译（关闭签名）==="
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: ldid fake-sign & package IPA
        run: |
          set -e
          echo "=== 安装 ldid ==="
          brew install ldid

          APP=$(find build/DerivedData -name "*.app" -maxdepth 8 | head -1)
          echo "找到 .app: $APP"

          echo "=== ldid 伪签名 ==="
          ldid -S "$APP"

          echo "=== 打包 Payload -> ipa ==="
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA_NAME="LieXi-trollstore-${GITHUB_RUN_NUMBER}.ipa"
          zip -r -q "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -lh "$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LieXi-trollstore-ipa
          path: LieXi-trollstore-*.ipa
          retention-days: 7
          if-no-files-found: error