name: Build iOS (TrollStore)

on:
  workflow_dispatch:      # 手动点按钮触发（推荐测试用）
  push:
    branches: [ main ]
    paths:
      - "Assets/**"
      - "ProjectSettings/**"
      - "Packages/**"
      - ".github/workflows/**"

jobs:
  # ============ 阶段 1：Linux 生成 Xcode 工程（免费额度）============
  # 关键：不单独 activate，让 builder 在同一个容器内自己激活（避免激活状态丢失）
  generate-xcode:
    name: 1. Generate Xcode project (Linux, free)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-LieXi-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-LieXi-iOS-

      # Personal 许可证：用邮箱+密码在线激活（去掉 .ulf，避免冲突）
      # 账号 yq114514@hotmail.com 是国际版 Personal，标准做法就是邮箱+密码
      - name: Build iOS (generate Xcode project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: iOS
          buildMethod: BuildScript.PerformBuild
          allowDirtyBuild: true
          dockerWorkspacePath: /github/workspace

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 1
          if-no-files-found: error

  # ============ 阶段 2：Mac 编译出未签名 .app → ldid → 巨魔 ipa ============
  build-ipa:
    name: 2. Compile & package TrollStore IPA (macOS)
    runs-on: macos-latest
    needs: generate-xcode     # 必须等阶段 1 出了工程才跑

    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: build/iOS

      - name: Locate Xcode project
        run: |
          set -e
          XCODEPROJ=$(find build/iOS -name "*.xcodeproj" -maxdepth 3 | head -1)
          echo "找到工程: $XCODEPROJ"
          echo "XCODEPROJ=$XCODEPROJ" >> $GITHUB_ENV

      - name: xcodebuild (unsigned .app)
        run: |
          set -e
          echo "=== 列出 scheme ==="
          xcodebuild -list -project "$XCODEPROJ"
          echo "=== 编译（关闭签名）==="
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: ldid fake-sign & package IPA
        run: |
          set -e
          echo "=== 安装 ldid ==="
          brew install ldid

          APP=$(find build/DerivedData -name "*.app" -maxdepth 8 | head -1)
          echo "找到 .app: $APP"

          echo "=== ldid 伪签名 ==="
          ldid -S "$APP"

          echo "=== 打包 Payload -> ipa ==="
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA_NAME="LieXi-trollstore-${GITHUB_RUN_NUMBER}.ipa"
          zip -r -q "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -lh "$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LieXi-trollstore-ipa
          path: LieXi-trollstore-*.ipa
          retention-days: 7
          if-no-files-found: error